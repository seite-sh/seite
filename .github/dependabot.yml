version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust-deps:
        patterns:
          - "*"
    ignore:
      # Tera 2 is a rewrite of the template API (templates/, shortcodes/, the
      # macro recursion guard); migrate in its own change, not a group bump.
      - dependency-name: "tera"
        update-types: ["version-update:semver-major"]
      # Pinned to the version htmd uses (its Node type); it moves with htmd.
      - dependency-name: "markup5ever_rcdom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Kept at the version resvg's usvg uses (else two copies are built); it
      # moves with resvg.
      - dependency-name: "skrifa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Kept at Tera 1's version (else two time zone databases are built).
      - dependency-name: "chrono-tz"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gh-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Base images in Dockerfile are pinned by digest; this keeps them current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
