name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0) — required for manual dispatch"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Cache cross binary
        if: matrix.use_cross
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-0.2

      - name: Install cross
        if: matrix.use_cross
        run: |
          if [ ! -f ~/.cargo/bin/cross ]; then
            cargo install cross --locked
          fi

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../seite-${{ matrix.target }}.tar.gz seite
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: seite-${{ matrix.target }}
          path: seite-${{ matrix.target }}.tar.gz

  build-windows:
    name: Build Windows (x86_64 + aarch64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build aarch64
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Package x86_64
        shell: pwsh
        run: |
          Compress-Archive -Path "target/x86_64-pc-windows-msvc/release/seite.exe" -DestinationPath "seite-x86_64-pc-windows-msvc.zip"

      - name: Package aarch64
        shell: pwsh
        run: |
          Compress-Archive -Path "target/aarch64-pc-windows-msvc/release/seite.exe" -DestinationPath "seite-aarch64-pc-windows-msvc.zip"

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: seite-x86_64-pc-windows-msvc
          path: seite-x86_64-pc-windows-msvc.zip

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: seite-aarch64-pc-windows-msvc
          path: seite-aarch64-pc-windows-msvc.zip

  release:
    name: Create release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        id: hash
        run: |
          cd artifacts
          sha256sum seite-*.tar.gz seite-*.zip 2>/dev/null > checksums-sha256.txt
          cat checksums-sha256.txt
          echo "digests=$(cat checksums-sha256.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/seite-*.tar.gz
            artifacts/seite-*.zip
            artifacts/checksums-sha256.txt

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.digests }}"
      upload-assets: true

  publish-mcpb:
    name: Publish MCPB bundles & MCP Registry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag and version
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Build MCPB bundles
        run: |
          VERSION="${{ steps.tag.outputs.version }}"

          # Prepare manifest with real version
          sed "s/VERSION_PLACEHOLDER/$VERSION/g" mcp/manifest.json > /tmp/manifest.json

          # Map targets to MCPB platform names
          declare -A PLATFORMS=(
            ["aarch64-apple-darwin"]="darwin-arm64"
            ["x86_64-apple-darwin"]="darwin-x64"
            ["x86_64-unknown-linux-gnu"]="linux-x64"
            ["aarch64-unknown-linux-gnu"]="linux-arm64"
          )

          mkdir -p mcpb-out

          for TARGET in "${!PLATFORMS[@]}"; do
            PLATFORM="${PLATFORMS[$TARGET]}"
            BUNDLE="seite-${PLATFORM}.mcpb"
            WORKDIR=$(mktemp -d)

            cp /tmp/manifest.json "$WORKDIR/manifest.json"
            mkdir -p "$WORKDIR/server"

            # Extract binary from release artifact
            tar xzf "artifacts/seite-${TARGET}.tar.gz" -C "$WORKDIR/server/"
            chmod +x "$WORKDIR/server/seite"

            # Create .mcpb (ZIP archive)
            (cd "$WORKDIR" && zip -r "/tmp/${BUNDLE}" manifest.json server/)
            mv "/tmp/${BUNDLE}" "mcpb-out/${BUNDLE}"
            rm -rf "$WORKDIR"

            echo "Built ${BUNDLE}"
          done

          # Windows x86_64
          WORKDIR=$(mktemp -d)
          cp /tmp/manifest.json "$WORKDIR/manifest.json"
          mkdir -p "$WORKDIR/server"
          unzip -o "artifacts/seite-x86_64-pc-windows-msvc.zip" -d "$WORKDIR/server/"
          (cd "$WORKDIR" && zip -r /tmp/seite-windows-x64.mcpb manifest.json server/)
          mv /tmp/seite-windows-x64.mcpb mcpb-out/
          rm -rf "$WORKDIR"
          echo "Built seite-windows-x64.mcpb"

          ls -la mcpb-out/

      - name: Upload MCPB bundles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for BUNDLE in mcpb-out/*.mcpb; do
            gh release upload "$TAG" "$BUNDLE" --clobber
          done

      - name: Publish to MCP Registry
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_KEY" ]; then
            echo "MCP_REGISTRY_KEY not set, skipping MCP Registry publish"
            exit 0
          fi

          VERSION="${{ steps.tag.outputs.version }}"

          # Compute SHA-256 of primary bundle (darwin-arm64)
          SHA=$(sha256sum mcpb-out/seite-darwin-arm64.mcpb | cut -d' ' -f1)

          # Generate server.json from template (mcp-publisher expects it in cwd)
          sed -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/SHA_PLACEHOLDER/$SHA/g" \
              mcp/server.json > server.json

          cat server.json

          # Install mcp-publisher
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

          # Authenticate via DNS (key is Ed25519 PEM stored in secret)
          echo "$MCP_REGISTRY_KEY" > /tmp/key.pem
          PRIVATE_KEY="$(openssl pkey -in /tmp/key.pem -noout -text 2>/dev/null | grep -A3 "priv:" | tail -n +2 | tr -d ' :\n')"
          rm -f /tmp/key.pem
          ./mcp-publisher login dns --domain "seite.sh" --private-key "$PRIVATE_KEY"

          # Publish to MCP Registry
          ./mcp-publisher publish

  publish-docker:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/seite-sh/seite:${{ steps.tag.outputs.version }}
            ghcr.io/seite-sh/seite:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  deploy-site:
    name: Deploy docs site
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: seite-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Install seite from release artifact
        run: |
          tar xzf artifacts/seite-x86_64-unknown-linux-gnu.tar.gz -C artifacts
          chmod +x artifacts/seite
          sudo mv artifacts/seite /usr/local/bin/seite
          seite --version

      - name: Generate releases.md from changelog entries
        run: bash scripts/generate-release-docs.sh

      - name: Build docs site
        working-directory: seite-sh
        run: seite build

      - name: Generate routing and download files
        working-directory: seite-sh
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Install scripts are in public/ and copied to dist/ by seite build

          # version.txt — latest version pointer
          echo "$TAG" > dist/version.txt

          # _redirects — route /download/ paths to GitHub Releases
          printf '/download/latest/* https://github.com/seite-sh/seite/releases/download/%s/:splat 302\n' "$TAG" > dist/_redirects
          printf '/download/* https://github.com/seite-sh/seite/releases/download/:splat 302\n' >> dist/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name seite-sh
          workingDirectory: seite-sh
